[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "component3"
version = "0.1.0"
description = "Adaptive Model Reliability Monitoring and Safe Maintenance Framework (Component 3)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
experiments = ["matplotlib>=3.7", "tabulate>=0.9", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
include = ["component3*"]
